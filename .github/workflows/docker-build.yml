name: Build and Push Docker Image

on:
  push:
    branches: [white-label]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nexlink-ai/nexlink-crm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout nexlink-crm
        uses: actions/checkout@v4

      - name: Clone frappe_docker
        run: git clone https://github.com/frappe/frappe_docker --depth 1

      - name: Copy apps.json into frappe_docker context
        run: cp apps.json frappe_docker/apps.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/white-label' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
          secrets: |
            apps_json=@frappe_docker/apps.json
