<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — NexLink CRM</title>
  <link rel="icon" type="image/png" href="/assets/crm/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e5e5e5;
      position: relative;
      overflow: hidden;
    }

    /* Dot grid pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #333 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* Subtle radial glow in center */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 36px 40px;
      width: 100%;
      max-width: 400px;
      margin: 0 16px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-wrap img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      content: url("/assets/crm/images/logo-dark.svg");
    }

    @media (prefers-color-scheme: light) {
      body { background-color: #f5f5f5; }
      body::before { background-image: radial-gradient(circle, #ccc 1px, transparent 1px); }
      .card { background: #fff; border-color: #e0e0e0; }
      .card h1 { color: #111; }
      .card .subtitle { color: #666; }
      .field label { color: #555; }
      .field input { background: #f7f7f7; border-color: #ddd; color: #111; }
      .field input::placeholder { color: #aaa; }
      .btn-primary { background: #111; color: #fff; }
      .btn-primary:hover { background: #333; }
      .footer { color: #999; }
      .footer .brand { color: #aaa; }
      .footer a { color: #aaa; }
      .logo-wrap img { content: url("/assets/crm/images/logo-light.svg"); }
    }

    .card h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: #f5f5f5;
      margin-bottom: 8px;
    }

    .card .subtitle {
      text-align: center;
      font-size: 13.5px;
      color: #888;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #f0f0f0;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input::placeholder { color: #555; }
    .field input:focus { border-color: #555; }

    .field.password-field {
      position: relative;
    }

    .field.password-field input { padding-right: 42px; }

    .toggle-pw {
      position: absolute;
      right: 12px;
      bottom: 11px;
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
    }

    .toggle-pw:hover { color: #aaa; }

    .btn-primary {
      width: 100%;
      background: #f0f0f0;
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      font-size: 12.5px;
      color: #f87171;
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: #444;
    }

    .footer .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 10px;
    }

    .footer a {
      color: #555;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer a:hover { color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/assets/crm/images/logo.svg" alt="NexLink CRM">
    </div>
    <h1>Entrar no NexLink CRM</h1>
    <p class="subtitle">Bem-vindo de volta. Insira suas credenciais para continuar.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="usr" placeholder="voce@exemplo.com" autocomplete="email" required>
      </div>
      <div class="field password-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="pwd" placeholder="Digite sua senha" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Mostrar senha">
          <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Entrar</button>
      <p class="error-msg" id="error-msg"></p>
    </form>
  </div>

  <footer class="footer">
    <div class="brand">NEXLINK</div>
    <div>
      <a href="https://nexlink.ai/termos">Termos de Serviço</a>
      <a href="https://nexlink.ai/privacidade">Política de Privacidade</a>
      <a href="https://nexlink.ai/cookies">Cookies</a>
      <span>©2026 NexLink</span>
    </div>
  </footer>

  <script>
    function togglePw() {
      const pw = document.getElementById('password');
      const open = document.getElementById('eye-open');
      const closed = document.getElementById('eye-closed');
      if (pw.type === 'password') {
        pw.type = 'text';
        open.style.display = 'none';
        closed.style.display = 'block';
      } else {
        pw.type = 'password';
        open.style.display = 'block';
        closed.style.display = 'none';
      }
    }

    // Get CSRF token from cookie
    function getCsrf() {
      const m = document.cookie.match(/csrf_token=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    }

    // Check redirect param
    function getRedirect() {
      const p = new URLSearchParams(window.location.search);
      return p.get('redirect-to') || '/crm';
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      err.style.display = 'none';

      const usr = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;

      try {
        const res = await fetch('/api/method/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Frappe-CSRF-Token': getCsrf(),
          },
          body: new URLSearchParams({ usr, pwd, cmd: 'login' }),
        });

        const data = await res.json();

        if (res.ok && data.message === 'Logged In') {
          window.location.href = getRedirect();
        } else {
          err.textContent = data.message || 'E-mail ou senha incorretos.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      } catch (ex) {
        err.textContent = 'Erro de conexão. Tente novamente.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
