<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — NexLink CRM</title>
  <link rel="icon" type="image/svg+xml" href="/assets/crm/images/logo-light.svg">
  <link rel="alternate icon" type="image/png" href="/assets/crm/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens ── */
    :root {
      --radius:             0.5rem;
      --background:         oklch(0.99 0 0);
      --foreground:         oklch(0.14 0 0);
      --card:               oklch(1 0 0);
      --card-foreground:    oklch(0.14 0 0);
      --primary:            oklch(0.21 0 0);
      --primary-foreground: oklch(0.98 0 0);
      --muted:              oklch(0.96 0 0);
      --muted-foreground:   oklch(0.46 0 0);
      --accent:             oklch(0.96 0 0);
      --accent-foreground:  oklch(0.14 0 0);
      --border:             oklch(0.92 0 0);
      --input:              oklch(0.92 0 0);
      --ring:               oklch(0.71 0 0);
      --destructive:        oklch(0.63 0.19 23.03);
      --logo-symbol:        url("https://d2xsxph8kpxj0f.cloudfront.net/310419663026780756/MTFqTxtsVs8MdxgLrdACj8/nexlink-x-black_07f04456.png");
      --logo-wordmark:      url("https://d2xsxph8kpxj0f.cloudfront.net/310419663026780756/MTFqTxtsVs8MdxgLrdACj8/nexlink-logo-black_659b369c.png");
    }
    .dark {
      --background:         oklch(0.16 0 0);
      --foreground:         oklch(0.93 0 0);
      --card:               oklch(0.19 0 0);
      --card-foreground:    oklch(0.93 0 0);
      --primary:            oklch(0.93 0 0);
      --primary-foreground: oklch(0.16 0 0);
      --muted:              oklch(0.22 0 0);
      --muted-foreground:   oklch(0.63 0 0);
      --accent:             oklch(0.26 0 0);
      --accent-foreground:  oklch(0.93 0 0);
      --border:             oklch(0.26 0 0);
      --input:              oklch(0.26 0 0);
      --ring:               oklch(0.63 0 0);
      --destructive:        oklch(0.69 0.20 23.91);
      --logo-symbol:        url("https://d2xsxph8kpxj0f.cloudfront.net/310419663026780756/MTFqTxtsVs8MdxgLrdACj8/nexlink-x-white_1224704e.png");
      --logo-wordmark:      url("https://d2xsxph8kpxj0f.cloudfront.net/310419663026780756/MTFqTxtsVs8MdxgLrdACj8/nexlink-logo-white_408eca6f.png");
    }

    /* ── Reset & base ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      box-shadow: none !important;
    }
    html, body { height: 100%; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "rlig" 1, "calt" 1;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── Canvas dot grid ── */
    #dot-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Main layout ── */
    .main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .form-wrap {
      width: 100%;
      max-width: 400px;
    }

    /* ── Card ── */
    .card {
      background: color-mix(in srgb, var(--card) 80%, transparent);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    /* ── Logo symbol ── */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .logo-symbol {
      width: 2.5rem;
      height: 2.5rem;
      object-fit: contain;
      content: var(--logo-symbol);
    }

    /* ── Headings ── */
    .card-title {
      font-size: 1.125rem;
      font-weight: 500;
      text-align: center;
      color: var(--foreground);
      margin-bottom: 0.25rem;
    }
    .card-sub {
      font-size: 0.875rem;
      text-align: center;
      color: var(--muted-foreground);
      margin-bottom: 1.5rem;
    }

    /* ── Google button ── */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 2.5rem;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      background: color-mix(in srgb, var(--background) 50%, transparent);
      color: var(--foreground);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 1rem;
      gap: 0.5rem;
      font-family: inherit;
    }
    .btn-google:hover { background: var(--accent); }

    /* ── Divider ── */
    .divider {
      position: relative;
      margin: 1rem 0;
    }
    .divider::before {
      content: '';
      position: absolute;
      inset: 0;
      top: 50%;
      border-top: 1px solid var(--border);
    }
    .divider span {
      position: relative;
      display: flex;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--muted-foreground);
      background: color-mix(in srgb, var(--card) 80%, transparent);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 0 0.75rem;
      width: fit-content;
      margin: 0 auto;
    }

    /* ── Error ── */
    .error-box {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: calc(var(--radius) - 2px);
      background: color-mix(in srgb, var(--destructive) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--destructive) 20%, transparent);
      color: var(--destructive);
      font-size: 0.875rem;
    }

    /* ── Form ── */
    form { display: flex; flex-direction: column; gap: 0.75rem; }

    .field { display: flex; flex-direction: column; gap: 0.375rem; }
    .field label {
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--muted-foreground);
      user-select: none;
    }
    .field-pw { position: relative; }
    .field input {
      height: 2.5rem;
      width: 100%;
      padding: 0.25rem 0.75rem;
      border-radius: calc(var(--radius) - 2px);
      border: 1px solid var(--input);
      background: transparent;
      font-size: 1rem;
      color: var(--foreground);
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .dark .field input { background: color-mix(in srgb, var(--input) 30%, transparent); }
    .field input::placeholder { color: var(--muted-foreground); font-size: 0.875rem; }
    .field input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent) !important;
    }
    .field input:disabled { pointer-events: none; opacity: 0.5; }
    .field-pw input { padding-right: 2.5rem; }

    .eye-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted-foreground);
      display: flex;
      align-items: center;
      transition: color 0.15s;
      padding: 0;
      tabindex: -1;
    }
    .eye-btn:hover { color: var(--foreground); }
    .eye-btn svg { width: 1rem; height: 1rem; }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      height: 2.5rem;
      margin-top: 0.5rem;
      border-radius: calc(var(--radius) - 2px);
      border: none;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { pointer-events: none; opacity: 0.5; }

    /* ── Toggle sign-in/register ── */
    .toggle-mode {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-top: 1.25rem;
    }
    .toggle-mode a {
      font-weight: 500;
      color: var(--foreground);
      text-decoration: none;
    }
    .toggle-mode a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 10;
      padding: 1rem 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .footer-logo {
      height: 1rem;
      width: auto;
      opacity: 0.5;
      content: var(--logo-wordmark);
    }
    .footer-links {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }
    .footer-links a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--foreground); }
    .footer-links span { color: var(--muted-foreground); }
  </style>
</head>
<body>
  <canvas id="dot-canvas"></canvas>

  <div class="main">
    <div class="form-wrap">
      <div class="card">
        <div class="logo-wrap">
          <img class="logo-symbol" alt="NexLink">
        </div>
        <h1 class="card-title">Entrar no NexLink CRM</h1>
        <p class="card-sub">Bem-vindo de volta. Insira suas credenciais para continuar.</p>

        <button type="button" class="btn-google" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
          </svg>
          Continuar com Google
        </button>

        <div class="divider"><span>ou</span></div>

        <div class="error-box" id="error-box"></div>

        <form id="login-form">
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="usr" placeholder="voce@exemplo.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <div class="field-pw">
              <input type="password" id="password" name="pwd" placeholder="Digite sua senha" autocomplete="current-password" required>
              <button type="button" class="eye-btn" id="eye-btn" tabindex="-1" onclick="togglePw()">
                <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="submit-btn">Entrar</button>
        </form>

        <p class="toggle-mode">
          Não tem uma conta? <a href="#">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>

  <footer>
    <img class="footer-logo" alt="NexLink">
    <div class="footer-links">
      <a href="https://www.nexlink.ai/termsofservice">Termos de Serviço</a>
      <a href="https://www.nexlink.ai/privacypolicy">Política de Privacidade</a>
      <a href="https://www.nexlink.ai/cookies">Cookies</a>
      <span>©2026 NexLink</span>
    </div>
  </footer>

  <script>
    /* ── Dark mode ── */
    (function () {
      const stored = localStorage.getItem('theme')
      const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      const dark = stored === 'dark' || (stored !== 'light' && sysDark)
      if (dark) document.documentElement.classList.add('dark')
      document.body.classList.toggle('dark', dark)
    })()

    /* ── Canvas dot grid ── */
    (function () {
      const canvas = document.getElementById('dot-canvas')
      const ctx = canvas.getContext('2d')
      const SPACING = 28, BASE_R = 1.2, MAX_R = 3, INFLUENCE = 120
      let mouse = { x: -9999, y: -9999 }, cols, rows, dpr

      function resize() {
        dpr = window.devicePixelRatio || 1
        canvas.width  = window.innerWidth  * dpr
        canvas.height = window.innerHeight * dpr
        canvas.style.width  = window.innerWidth  + 'px'
        canvas.style.height = window.innerHeight + 'px'
        ctx.scale(dpr, dpr)
        cols = Math.ceil(window.innerWidth  / SPACING) + 1
        rows = Math.ceil(window.innerHeight / SPACING) + 1
      }

      function isDark() { return document.body.classList.contains('dark') }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        const baseAlpha = isDark() ? 0.20 : 0.18
        const maxAlpha  = isDark() ? 0.70 : 0.63
        const rgb       = isDark() ? '255,255,255' : '0,0,0'

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = c * SPACING, y = r * SPACING
            const dx = x - mouse.x, dy = y - mouse.y
            const dist = Math.sqrt(dx * dx + dy * dy)
            const t = dist < INFLUENCE ? 1 - dist / INFLUENCE : 0
            const alpha  = baseAlpha + (maxAlpha - baseAlpha) * t
            const radius = BASE_R   + (MAX_R    - BASE_R)    * t
            ctx.beginPath()
            ctx.arc(x, y, radius, 0, Math.PI * 2)
            ctx.fillStyle = 'rgba(' + rgb + ',' + alpha + ')'
            ctx.fill()
          }
        }
        requestAnimationFrame(draw)
      }

      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY })
      window.addEventListener('resize', resize)
      resize()
      draw()
    })()

    /* ── Password toggle ── */
    function togglePw() {
      const pw = document.getElementById('password')
      const open = document.getElementById('eye-open')
      const closed = document.getElementById('eye-closed')
      const isText = pw.type === 'text'
      pw.type = isText ? 'password' : 'text'
      open.style.display   = isText ? 'block' : 'none'
      closed.style.display = isText ? 'none'  : 'block'
    }

    /* ── Google (placeholder) ── */
    function handleGoogle() {
      const err = document.getElementById('error-box')
      err.textContent = 'Login com Google não está disponível ainda.'
      err.style.display = 'block'
    }

    /* ── CSRF from cookie ── */
    function getCsrf() {
      const m = document.cookie.match(/csrf_token=([^;]+)/)
      return m ? decodeURIComponent(m[1]) : ''
    }

    function getRedirect() {
      return new URLSearchParams(window.location.search).get('redirect-to') || '/crm'
    }

    /* ── Login submit ── */
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault()
      const btn = document.getElementById('submit-btn')
      const err = document.getElementById('error-box')
      btn.disabled = true
      btn.textContent = 'Entrando...'
      err.style.display = 'none'

      try {
        const res = await fetch('/api/method/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Frappe-CSRF-Token': getCsrf(),
          },
          body: new URLSearchParams({
            usr: document.getElementById('email').value,
            pwd: document.getElementById('password').value,
            cmd: 'login',
          }),
        })
        const data = await res.json()
        if (res.ok && data.message === 'Logged In') {
          window.location.href = getRedirect()
        } else {
          err.textContent = data.message || 'E-mail ou senha incorretos.'
          err.style.display = 'block'
          btn.disabled = false
          btn.textContent = 'Entrar'
        }
      } catch {
        err.textContent = 'Erro de conexão. Tente novamente.'
        err.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Entrar'
      }
    })
  </script>
</body>
</html>
